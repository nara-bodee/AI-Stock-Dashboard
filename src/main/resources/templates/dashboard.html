<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>AI Stock Dashboard</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 40px;
        }

        h1 {
            color: #1e293b;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th {
            background: #2563eb;
            color: white;
            padding: 12px;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f8fafc;
        }

        .profit {
            color: green;
            font-weight: bold;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

    </style>

</head>
<body>

<h1>AI Stock Dashboard</h1>
<div class="card">

    <h2>Portfolio Dashboard</h2>

    <p>
        Holdings:
        <span th:text="${positions.size()}"></span>
    </p>

</div>
<table border="1">

    <tr>
        <th>Symbol</th>
        <th>Shares</th>
        <th>Price</th>
        <th>Gain/Loss</th>
    </tr>

    <tr th:each="position : ${positions}">

        <td th:text="${position.symbol}"></td>

        <td th:text="${position.shares}"></td>

        <td th:text="${position.price}"></td>

        <td
            class="profit"
            th:text="${#numbers.formatDecimal(position.gainLoss,1,2)}">
        </td>

</table>

</body>
</html>
